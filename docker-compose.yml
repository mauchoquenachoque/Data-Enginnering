version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqnzq8=
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
    - MOTHERDUCK_TOKEN=${MOTHERDUCK_TOKEN:-}
    - MOTHERDUCK_DATABASE=${MOTHERDUCK_DATABASE:-byteflow_prod}
    - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./dbt_project:/opt/airflow/dbt_project
    - ./logs:/opt/airflow/logs
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  # Metadata Database for Airflow
  airflow-postgres:
    image: postgres:15-alpine
    container_name: byteflow-airflow-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5433:5432"
    volumes:
      - airflow-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  # Airflow DB Init
  airflow-init:
    <<: *airflow-common
    container_name: byteflow-airflow-init
    command: version
    environment:
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    depends_on:
      airflow-postgres:
        condition: service_healthy

  # Airflow Webserver
  airflow-webserver:
    <<: *airflow-common
    container_name: byteflow-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  # Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    container_name: byteflow-airflow-scheduler
    command: scheduler
    restart: always

  # Local Kafka Broker (if not using Upstash / Confluent)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: byteflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: byteflow-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Streaming Producer Service
  event-producer:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: byteflow-producer
    command: python -m src.producers.order_stream_producer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - KAFKA_TOPIC_ORDERS=${KAFKA_TOPIC_ORDERS:-ecommerce.orders}
    depends_on:
      - kafka
    restart: on-failure

  # Streaming Consumer & Loader Service
  event-loader:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: byteflow-loader
    command: python -m src.consumers.order_stream_loader
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - KAFKA_TOPIC_ORDERS=${KAFKA_TOPIC_ORDERS:-ecommerce.orders}
      - MOTHERDUCK_TOKEN=${MOTHERDUCK_TOKEN:-}
      - MOTHERDUCK_DATABASE=${MOTHERDUCK_DATABASE:-byteflow_prod}
    depends_on:
      - kafka
    restart: on-failure

volumes:
  airflow-db-volume:
