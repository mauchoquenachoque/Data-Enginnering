byteflow_profile:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('MOTHERDUCK_DATABASE', 'byteflow_local.duckdb') if not env_var('MOTHERDUCK_TOKEN', '') else 'md:' ~ env_var('MOTHERDUCK_DATABASE', 'byteflow_prod') }}"
      token: "{{ env_var('MOTHERDUCK_TOKEN', '') }}"
      threads: 4

    prod:
      type: duckdb
      path: "md:{{ env_var('MOTHERDUCK_DATABASE', 'byteflow_prod') }}"
      token: "{{ env_var('MOTHERDUCK_TOKEN') }}"
      threads: 8

    test:
      type: duckdb
      path: "/tmp/byteflow_test.duckdb"
      threads: 2
