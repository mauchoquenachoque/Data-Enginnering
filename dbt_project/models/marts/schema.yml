version: 2

models:
  - name: fct_daily_sales
    description: "Daily aggregated e-commerce transactions, gross revenue, and payment conversion metrics"
    columns:
      - name: sales_date
        description: "Transaction day"
        tests:
          - not_null
      - name: customer_country
        description: "Country where purchases originated"
        tests:
          - not_null
      - name: gross_revenue_usd
        description: "Total revenue generated by completed orders"
        tests:
          - not_null

  - name: dim_customers
    description: "Customer dimensional model with segmentation tiers and lifecycle tracking"
    columns:
      - name: customer_id
        description: "Primary key for customer dimension"
        tests:
          - unique
          - not_null
      - name: customer_tier
        description: "Customer value segmentation"
        tests:
          - accepted_values:
              values: ['VIP / High Value', 'Regular / Medium Value', 'Occasional Buyer', 'Prospect / Inactive']
