name: ByteFlow CI/CD Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: 🧪 Quality, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Code Linter (Black & Flake8)
        run: |
          black --check src/ tests/
          flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503

      - name: Lint dbt SQL Models (SQLFluff)
        run: |
          cd dbt_project
          sqlfluff lint models/ --dialect duckdb

      - name: Execute Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Verify dbt Models in Test Sandbox
        run: |
          cd dbt_project
          dbt deps --profiles-dir .
          dbt build --target test --profiles-dir .

  build-and-publish:
    name: 🐳 Build & Push Container Images
    needs: [test-and-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Airflow & Ingestion Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: airflow/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/byteflow-engine:latest
            ghcr.io/${{ github.repository }}/byteflow-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-public-cloud:
    name: 🚀 Deploy to Public Cloud / SaaS
    needs: [build-and-publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Automated Deployment Webhook (Render / Fly.io / GCP)
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering zero-downtime rolling deployment to cloud PaaS..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deployment triggered successfully."

      - name: Automated Production dbt Cloud Run
        if: env.MOTHERDUCK_TOKEN != ''
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: ${{ secrets.MOTHERDUCK_DATABASE || 'byteflow_prod' }}
        run: |
          pip install dbt-core dbt-duckdb
          cd dbt_project
          dbt deps --profiles-dir .
          dbt seed --target prod --profiles-dir .
          dbt run --target prod --profiles-dir .
          dbt test --target prod --profiles-dir .
